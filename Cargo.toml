[package]
name = "perch"
version = "0.1.0"
edition = "2024"
license = "MIT"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d"] }
wasm-bindgen = "=0.2.121"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "Node",
  "HtmlCanvasElement",
  "HtmlVideoElement",
  "ImageData",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "Navigator",
  "Window",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
